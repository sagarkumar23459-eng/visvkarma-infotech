<!DOCTYPE html>
<html>

<head>

<title>Edit Product</title>

<link rel="stylesheet" href="../css/admin.css">

</head>


<body>


<div class="admin-container">


<aside class="sidebar">

<h2>
🧪 Sibani Chemicals
</h2>


<a href="../dashboard.html">
Dashboard
</a>


<a href="products.html">
Products
</a>

</aside>




<section class="main">


<div class="topbar">

<h1>
Edit Product
</h1>

</div>



<div class="form-card">


<form id="editForm">


<input id="name" placeholder="Product Name">


<input id="category" placeholder="Category">


<input id="brand" placeholder="Brand">


<textarea id="description"
placeholder="Description">
</textarea>


<input 
type="number"
id="price"
placeholder="Price"
>


<input 
type="number"
id="stock"
placeholder="Stock"
>


<label>
New Image (optional)
</label>


<input 
type="file"
id="image"
>



<button type="submit">
Update Product
</button>

<p id="message"></p>


</form>


</div>


</section>


</div>



<script src="../js/edit-product.js"></script>


</body>

</html>
