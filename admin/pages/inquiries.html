<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Inquiries</title>

<link rel="stylesheet" href="../css/admin.css">
<style>

    /* =====================================
   SIBHANI CHEMICALS
   PREMIUM ADMIN INQUIRY UI
===================================== */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Inter",sans-serif;
}


body{

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #f1f5f9,
        #eef2ff
    );

    color:#0f172a;

}


/* MAIN */

.admin-container{

    width:92%;

    max-width:1400px;

    margin:50px auto;

}



/* TITLE */


.admin-container h1{

    font-size:38px;

    font-weight:700;

    margin-bottom:35px;

    color:#111827;

    position:relative;

}


.admin-container h1::after{

    content:"";

    position:absolute;

    left:0;

    bottom:-12px;

    width:80px;

    height:4px;

    border-radius:10px;

    background:
    linear-gradient(
        90deg,
        #2563eb,
        #7c3aed
    );

}



/* SUMMARY */


.summary-cards{

    display:flex;

    gap:25px;

    margin-bottom:35px;

}



.summary-card{


    width:300px;

    padding:30px;


    border-radius:24px;


    background:
    linear-gradient(
        135deg,
        #2563eb,
        #4f46e5
    );


    color:white;


    box-shadow:

    0 20px 40px rgba(37,99,235,.25);


    transition:.35s;


    position:relative;

    overflow:hidden;


}



.summary-card::before{

    content:"";

    position:absolute;

    width:150px;

    height:150px;

    background:rgba(255,255,255,.15);

    border-radius:50%;

    right:-40px;

    top:-40px;

}



.summary-card:hover{

    transform:translateY(-8px);

}



.summary-card h3{

    font-size:15px;

    opacity:.9;

    font-weight:500;

}



.summary-card h2{

    margin-top:15px;

    font-size:48px;

    font-weight:700;

}





/* TABLE */


#inquiryTable{


    width:100%;


    border-collapse:separate;


    border-spacing:0;


    background:white;


    border-radius:22px;


    overflow:hidden;


    box-shadow:

    0 20px 50px rgba(15,23,42,.10);


}




#inquiryTable thead{


    background:

    linear-gradient(
        135deg,
        #0f172a,
        #1e293b
    );


}



#inquiryTable th{


    padding:20px;


    color:white;


    text-align:left;


    font-size:14px;


    font-weight:600;


    letter-spacing:.5px;


}




#inquiryTable td{


    padding:20px;


    color:#475569;


    border-bottom:

    1px solid #e5e7eb;


    font-size:14px;


}





#inquiryTable tbody tr{


    transition:.3s;


}





#inquiryTable tbody tr:hover{


    background:#f8fafc;


    transform:scale(1.01);


}




/* MESSAGE */

#inquiryTable td:nth-child(5){

    max-width:300px;

    line-height:1.6;

}



/* DATE */

#inquiryTable td:last-child{

    color:#64748b;

    font-weight:500;

}



/* EMPTY */

#inquiryTable tbody:empty::after{

    content:"No inquiries found";

    display:block;

    text-align:center;

    padding:50px;

    color:#94a3b8;

}



/* SCROLL */


.admin-container{

    overflow-x:auto;

}



#inquiryTable::-webkit-scrollbar{

    height:8px;

}


#inquiryTable::-webkit-scrollbar-thumb{

    background:#cbd5e1;

    border-radius:20px;

}



/* MOBILE */


@media(max-width:900px){


.admin-container{

    width:95%;

}


.admin-container h1{

    font-size:28px;

}



.summary-card{

    width:100%;

}


#inquiryTable{

    min-width:1000px;

}
.table-wrapper{
    overflow:hidden;
    border-radius:22px;
}

}

.delete-btn{

    padding:9px 16px;

    border:none;

    border-radius:10px;

    background:#fee2e2;

    color:#dc2626;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}


.delete-btn:hover{

    background:#dc2626;

    color:white;

    transform:translateY(-2px);

}
</style>

</head>

<body>

<div class="admin-container">

<h1>Customer Orders</h1>
<div class="summary-cards">

    <div class="summary-card">
        <h3>Total Orders</h3>
        <h2 id="totalOrders">0</h2>
    </div>

</div  class="table-wrapper">

<table id="inquiryTable">

<thead>

<tr>

<th>Product</th>
<th>Name</th>
<th>Phone</th>
<th>Email</th>
<th>Product Quantity</th>
<th>Address</th>
<th>Order Placed</th>
<th>Message</th>
<th>Date</th>
<th>Action</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

<script src="../js/inquiries.js"></script>

</body>
</html>
